# Local dev/test compose. Builds the image from this repo.
# Recipients use deploy/docker-compose.yml (which pulls a published image).
services:
  photo-viewer:
    build: .
    image: photo-viewer:1.0.0
    container_name: photo-viewer
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATA_DIR: /app/server/data
      SESSION_SECRET: ${SESSION_SECRET:-photo-viewer-dev-secret-change-me}
    volumes:
      - ./data:/app/server/data:rw
      - ${LIBRARY_PATH:-./sample-library}:/library:ro

# Photo Viewer — production compose for self-install on a single LAN.
# Recipients edit the sibling `.env` (created from `.env.example`), then run:
#   docker compose pull && docker compose up -d
services:
  photo-viewer:
    image: ghcr.io/paulmarshall-wfw/photo-viewer:${IMAGE_TAG:-1.0.4}
    container_name: photo-viewer
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATA_DIR: /app/server/data
      SETUP_LIBRARY_PATH: /library
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
    volumes:
      # Metadata DB + preview cache. Keep it next to this compose file.
      - ./data:/app/server/data:rw
      # The family's photo library. Read-only — this app never writes back.
      - ${LIBRARY_PATH:?LIBRARY_PATH must be set in .env}:/library:ro
